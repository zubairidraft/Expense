name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: |
          npm install
          npm install --prefix packages/core

      - name: 4. Build Production Web Assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://nmbxopltqeilhzplwcgs.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tYnhvcGx0cWVpbGh6cGx3Y2dzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTI4NzAsImV4cCI6MjEwNjk2ODg3MH0.j1Q6MGzf2TgnqZaqU6diorEbBJ6NJrAod2zKOQi4PgI' }}
        run: npm run build

      - name: 5. Sync Web Assets to Android Platform
        run: npx cap sync android

      - name: 6. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: 7. Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: 8. Assemble Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 9. Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpensePro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
