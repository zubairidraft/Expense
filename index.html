<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker Pro — Intelligent Finance Dashboard</title>
    <meta name="description" content="Modern AI-assisted expense tracking application with visual annotation and budgeting." />
    <meta name="theme-color" content="#121318" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="preload" href="/fonts/material-symbols-rounded-subset.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root">
      <div style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#121318;color:#ffffff;font-family:system-ui,-apple-system,sans-serif;flex-direction:column;gap:16px;">
        <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.15);border-top-color:#6366f1;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <div style="font-size:15px;letter-spacing:0.4px;font-weight:500;opacity:0.9;">Loading Expense Pro...</div>
      </div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        console.error('[Startup Error]', e.message, e.filename, e.lineno);
        const root = document.getElementById('root');
        if (root && (!root.children || root.children.length <= 1)) {
          root.innerHTML = '<div style="padding:24px;color:#fff;background:#181014;font-family:monospace;min-height:100vh;">' +
            '<h2 style="color:#ff5555;margin:0 0 12px 0;">Initialization Error</h2>' +
            '<p style="color:#f0f0f0;font-size:13px;word-break:break-all;">' + (e.message || 'Unknown error') + '</p>' +
            '<p style="color:#888;font-size:11px;">' + (e.filename || '') + ':' + (e.lineno || '') + '</p>' +
            '<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#6366f1;color:#fff;border:none;border-radius:6px;cursor:pointer;">Retry</button>' +
          '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const isCapacitor = Boolean(window.Capacitor || (window.location.protocol === 'https:' && window.location.hostname === 'localhost'));
      if ('serviceWorker' in navigator && !isCapacitor && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('[SW] Service worker registration ignored:', err);
          });
        });
      } else if (isCapacitor && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const reg of registrations) reg.unregister();
        }).catch(() => {});
      }
    </script>
  </body>
</html>
